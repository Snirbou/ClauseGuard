version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: clauseguard-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: clauseguard
      POSTGRES_PASSWORD: clauseguard
      POSTGRES_DB: clauseguard
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
