name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint, tests, migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clauseguard
          POSTGRES_PASSWORD: clauseguard
          POSTGRES_DB: clauseguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clauseguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # The spaCy language model (~600MB) is deliberately NOT installed:
        # classifier.py detects the missing model and falls back to keyword
        # rules, which is exactly the degradation path CI should exercise.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff httpx

      - name: Ruff
        run: python -m ruff check .

      # The two test roots run separately: ml_inference/src and
      # ml_training/src both expose top-level `src`/`features` modules and
      # collide (4 collection errors) when pytest collects them together.
      # This mirrors the verify-clauseguard skill exactly.
      - name: Unit tests (api)
        run: python -m pytest tests/ -q

      - name: Unit tests (ml)
        run: python -m pytest ml_training/tests/ -q

      - name: Migrations — fresh database from baseline
        env:
          DATABASE_URL: postgresql+asyncpg://clauseguard:clauseguard@localhost:5432/clauseguard
        run: |
          python -c "import asyncio; from database import init_db; asyncio.run(init_db())"
          python -c "import asyncio; from database import init_db; asyncio.run(init_db())"  # idempotent

  frontend:
    name: Frontend — types, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src

      - name: Build
        run: npm run build
