# Ruff configuration for the ClauseGuard backend.

line-length = 100
target-version = "py313"
extend-exclude = ["venv", "alembic/versions"]

[lint]
# Errors, pyflakes, import order, bugbear, and modern-syntax upgrades.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    "B008",   # function call in default argument — FastAPI's Depends() idiom
    "E731",   # lambda assignments are fine at this scale
]

[lint.per-file-ignores]
# Training scripts are numbered by convention (00_setup.py, 01_download...).
"ml_training/scripts/*" = ["E402"]
# Deliberate import-order pins (numpy before dspy) and path setup.
"main.py" = ["E402", "I001"]
"classifier.py" = ["E402", "I001"]
"run_pipeline.py" = ["E402"]
